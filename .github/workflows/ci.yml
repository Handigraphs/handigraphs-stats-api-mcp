name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform-validation:
    name: platform-validation (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run pack:check
      - run: npm run distributions:check
      - run: npm run mcpb:check

  test-build-pack:
    name: test-build-pack
    if: ${{ always() }}
    needs: platform-validation
    runs-on: ubuntu-latest
    steps:
      - name: Require every platform validation to pass
        env:
          PLATFORM_VALIDATION_RESULT: ${{ needs.platform-validation.result }}
        run: test "$PLATFORM_VALIDATION_RESULT" = "success"
