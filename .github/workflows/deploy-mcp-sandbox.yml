name: Deploy hosted MCP sandbox

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm:
        description: Type deploy-sandbox (requires separate operator opt-in)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: hosted-mcp-sandbox
  cancel-in-progress: false

env:
  DEPLOY_TARGET: sandbox
  MCP_SHA: ${{ github.sha }}
  DEPLOY_CONFIRM: ${{ inputs.confirm }}
  HOSTED_SANDBOX_DEPLOY_ENABLED: ${{ vars.HOSTED_SANDBOX_DEPLOY_ENABLED }}

jobs:
  validate:
    if: ${{ github.repository == 'Handigraphs/handigraphs-stats-api-mcp' && github.ref == 'refs/heads/main' && vars.HOSTED_SANDBOX_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: node scripts/check-hosted-deploy.mjs request
        env:
          GH_TOKEN: ${{ github.token }}
      # No platform, evidence or OAuth credentials are available to npm scripts.
      - run: npm ci
      - run: npm run audit:prod
      - run: npm test
      - run: npm run typecheck
      - run: npm run heroku-postbuild
      - run: npm run pack:check
      - run: npm run distributions:check
      - run: npm run mcpb:check

  deploy:
    needs: validate
    if: ${{ github.repository == 'Handigraphs/handigraphs-stats-api-mcp' && github.ref == 'refs/heads/main' && vars.HOSTED_SANDBOX_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: sandbox
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build exact approved source on the fixed sandbox app
        run: node scripts/check-hosted-deploy.mjs deploy
        env:
          GH_TOKEN: ${{ github.token }}
          HEROKU_DEPLOY_API_KEY: ${{ secrets.HEROKU_MCP_SANDBOX_API_KEY }}
