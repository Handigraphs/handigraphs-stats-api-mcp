name: Deploy hosted MCP production

on:
  workflow_dispatch:
    inputs:
      mcp_sha:
        description: Exact 40-character MCP main SHA (must equal this workflow source)
        required: true
        type: string
      app_sha:
        description: Exact 40-character app SHA named as accepted_app_sha in deploy/owner-acceptance.json
        required: true
        type: string
      confirm:
        description: Type deploy-production
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: hosted-mcp-production
  cancel-in-progress: false

env:
  DEPLOY_TARGET: production
  MCP_SHA: ${{ inputs.mcp_sha }}
  APP_SHA: ${{ inputs.app_sha }}
  DEPLOY_CONFIRM: ${{ inputs.confirm }}

jobs:
  validate:
    if: ${{ github.repository == 'Handigraphs/handigraphs-stats-api-mcp' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: node scripts/check-hosted-deploy.mjs request
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm ci
      - run: npm run audit:prod
      - run: npm test
      - run: npm run typecheck
      - run: npm run heroku-postbuild
      - run: npm run pack:check
      - run: npm run distributions:check
      - run: npm run mcpb:check

  # Owner decision 2026-10-24: the owner's recorded acceptance of the completed sandbox
  # acceptance replaces the published evidence artifact. The deployed runtime must equal
  # the accepted MCP commit, and the production environment approval below still applies.
  acceptance:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require the owner acceptance and a runtime identical to the accepted MCP commit
        run: node scripts/check-hosted-deploy.mjs acceptance
        env:
          GH_TOKEN: ${{ github.token }}

  deploy:
    needs: [validate, acceptance]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recheck environment approval and owner acceptance, then build fixed production source
        run: node scripts/check-hosted-deploy.mjs deploy
        env:
          GH_TOKEN: ${{ github.token }}
          HEROKU_DEPLOY_API_KEY: ${{ secrets.HEROKU_MCP_PRODUCTION_API_KEY }}
