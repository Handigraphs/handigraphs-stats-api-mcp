plans_dir: plans
default_branch: main
branch_prefix: codex
worktree: required
pr_flow: true
required_checks: [test-build-pack]
validate:
  mcp: |
    npm ci
    if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    foreach ($script in @('test','audit:prod','typecheck','build','pack:check','distributions:check','mcpb:check')) {
      npm run $script
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    }
never_modify: ['.env', '**/.env']
review:
  pr_as_draft: false
# No local UI or review app. Hosted sandbox deployment is opt-in and default off;
# production is manual/exact-SHA, requires real environment approval and private
# same-pair acceptance evidence. Source merges authorize none of those operations.
# npm/MCPB releases and manual merges still require separate explicit approval.
